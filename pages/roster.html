<section class="page-header">
    <h2>👥 Состав E3U</h2>
    <p>Все участники семьи.</p>
</section>

<div id="rosterList" class="roster-grid"></div>

<script>
async function loadRoster(){

    const response = await fetch("data/players.json");
    const players = await response.json();

    const roster = document.getElementById("rosterList");

    roster.innerHTML = "";

    players.forEach(player=>{

        roster.innerHTML += `
        <div class="member-card">

            <div class="member-avatar">
                ${player.avatar ? `<img src="${player.avatar}">` : "👤"}
            </div>

            <div class="member-name">${player.nickname}</div>

            <div class="member-tag">
                E3U • ${player.rank}
            </div>

            <div class="member-status ${player.online ? "online":"offline"}">
                ● ${player.online ? "В сети":"Не в сети"}
            </div>

            <div class="member-warrior">
                ${player.warrior ? "⚔ Воин":"🛡 Участник"}
            </div>

            <small>${player.id}</small>

        </div>
        `;

    });

}

loadRoster();
</script>
