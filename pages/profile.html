<section class="login-screen">

  <div class="login-card">

    <div class="login-logo">E3U</div>

    <h2>Вход в штаб</h2>

    <p>Введите игровой ник.</p>

    <input id="nickname" type="text" placeholder="Игровой ник">

    <select id="rank">
      <option>R1</option>
      <option>R2</option>
      <option>R3</option>
      <option>R4</option>
      <option>R5</option>
      <option>LR5</option>
    </select>

    <select id="language">
      <option value="ru">Русский</option>
      <option value="en">English</option>
      <option value="es">Español</option>
      <option value="ua">Українська</option>
    </select>

    <button id="loginBtn">Войти</button>

  </div>

</section>
