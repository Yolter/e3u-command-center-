<section class="page-header">
    <h2>👑 Штаб E3U</h2>
    <p>Управление составом.</p>
</section>

<div class="admin-panel">

    <div class="card">

        <h3>➕ Добавить игрока</h3>

        <input id="newName" placeholder="Игровой ник">

        <select id="newRank">
            <option>R1</option>
            <option>R2</option>
            <option>R3</option>
            <option>R4</option>
            <option>R5</option>
            <option>LR5</option>
        </select>

        <button class="btn" onclick="addPlayer()">Добавить</button>

    </div>

    <div class="card">

        <h3>👥 Список игроков</h3>

        <div id="playerList"></div>

    </div>

</div>

<script>

const STORAGE="e3u_players";

async function getPlayers(){

    let saved=localStorage.getItem(STORAGE);

    if(saved) return JSON.parse(saved);

    const res=await fetch("data/players.json");

    const data=await res.json();

    localStorage.setItem(STORAGE,JSON.stringify(data));

    return data;

}

async function renderPlayers(){

    const players=await getPlayers();

    const list=document.getElementById("playerList");

    list.innerHTML="";

    players.forEach((p,index)=>{

        list.innerHTML+=`
        <div class="player-row">

            <div>
                <b>${p.nickname}</b><br>
                <small>E3U • ${p.rank} • ${p.id}</small>
            </div>

            <button onclick="removePlayer(${index})">❌</button>

        </div>`;
    });

}

async function addPlayer(){

    const name=document.getElementById("newName").value.trim();

    const rank=document.getElementById("newRank").value;

    if(!name) return;

    const players=await getPlayers();

    players.push({
        id:"E3U-"+String(players.length+1).padStart(3,"0"),
        nickname:name,
        rank,
        role:rank,
        warrior:false,
        online:false,
        avatar:""
    });

    localStorage.setItem(STORAGE,JSON.stringify(players));

    document.getElementById("newName").value="";

    renderPlayers();

}

async function removePlayer(index){

    const players=await getPlayers();

    players.splice(index,1);

    localStorage.setItem(STORAGE,JSON.stringify(players));

    renderPlayers();

}

renderPlayers();

</script>
