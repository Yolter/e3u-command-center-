
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E3U Command Center</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,Arial,sans-serif;}
body{
background:linear-gradient(180deg,#050505,#111);
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}
.container{
width:100%;
max-width:420px;
}
.logo{
text-align:center;
margin-bottom:35px;
}
.logo h1{
color:#D4AF37;
font-size:38px;
letter-spacing:2px;
}
.logo p{
color:#aaa;
margin-top:8px;
}
.panel{
background:#111;
border:1px solid rgba(212,175,55,.4);
border-radius:24px;
padding:30px;
box-shadow:0 0 30px rgba(212,175,55,.12);
}
.title{
text-align:center;
margin-bottom:25px;
}
.title h2{
color:#D4AF37;
margin-bottom:8px;
}
.title p{
color:#bdbdbd;
font-size:14px;
}
.btn{
display:flex;
align-items:center;
justify-content:space-between;
background:linear-gradient(180deg,#D4AF37,#B8860B);
color:#111;
padding:16px 18px;
border-radius:16px;
text-decoration:none;
font-weight:bold;
margin-bottom:15px;
transition:.25s;
}
.btn:hover{
transform:translateY(-3px);
box-shadow:0 8px 20px rgba(212,175,55,.25);
}
.badge{
display:inline-block;
background:#1f1f1f;
border:1px solid #D4AF37;
color:#D4AF37;
padding:6px 12px;
border-radius:999px;
font-size:12px;
margin-top:10px;
}
.footer{
text-align:center;
margin-top:25px;
color:#777;
font-size:13px;
}
.status{
margin-top:25px;
padding:18px;
background:#181818;
border-radius:16px;
border:1px solid #333;
}
.status h3{
color:#D4AF37;
margin-bottom:10px;
font-size:16px;
}
.status ul{
list-style:none;
}
.status li{
padding:6px 0;
color:#ddd;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">
<h1>E3U</h1>
<p>Command Center</p>
<span class="badge">The Grand Mafia</span>
</div>

<div class="panel">

<div class="title">
<h2>Добро пожаловать</h2>
<p>Внутренний штаб клана E3U</p>
</div>

<a class="btn" href="#">
<span>🎓 Игрок</span>
<span>→</span>
</a>

<a class="btn" href="#">
<span>🛡️ R4</span>
<span>→</span>
</a>

<a class="btn" href="#">
<span>👑 R5</span>
<span>→</span>
</a>

<div class="status">
<h3>Боевой статус</h3>
<ul>
<li>🟡 BG — ожидание</li>
<li>🌍 Битва городов — скоро</li>
<li>🚚 Грузовик — активен</li>
<li>💰 Банк — под контролем</li>
</ul>
</div>

</div>

<div class="footer">
E3U Command Center • v1.0
</div>

</div>

</body>
</html>
