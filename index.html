<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>E3U Command Center</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<audio id="bgMusic" loop>
    <source src="assets/audio/soundtrack.mp3" type="audio/mpeg">
</audio>

<div class="music-btn" onclick="toggleMusic()">
    🎵
</div>

<div class="background-glow"></div>

<div class="container">

    <div class="logo">

        <img src="assets/images/logo.png" alt="E3U Logo" class="logo-img">

        <h1>E3U</h1>
        <p>Command Center</p>

        <div class="badge">
            The Grand Mafia
        </div>

    </div>

    <div class="panel">

        <div class="title">
            <h2>Добро пожаловать</h2>
            <p>Внутренний штаб клана E3U</p>
        </div>

        <a class="btn" href="player.html">
            <span>🎮 Игрок</span>
            <span>→</span>
        </a>

        <a class="btn" href="officer-test.html">
            <span>🛡 R4 Аттестация</span>
            <span>→</span>
        </a>

        <a class="btn" href="r5.html">
            <span>👑 Кабинет R5</span>
            <span>→</span>
        </a>

        <div class="status">

            <h3>Боевой статус</h3>

            <ul>
                <li>🟡 BG — ожидание</li>
                <li>🌍 Битва городов — скоро</li>
                <li>🚛 Грузовик — активен</li>
                <li>💰 Банк — под контролем</li>
            </ul>

        </div>

    </div>

    <div class="footer">
        E3U Command Center • v2.0
    </div>

</div>

<script src="js/app.js"></script>

</body>
</html>
