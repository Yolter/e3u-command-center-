
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Офицерская комиссия E3U</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,Arial,sans-serif;}
body{
background:linear-gradient(180deg,#050505,#111);
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}
.box{
max-width:430px;
width:100%;
background:#111;
border:1px solid rgba(212,175,55,.35);
border-radius:22px;
padding:30px;
}
h1{color:#D4AF37;text-align:center;margin-bottom:10px;}
.sub{text-align:center;color:#aaa;margin-bottom:25px;}
label{display:block;margin-top:15px;margin-bottom:8px;color:#D4AF37;font-weight:bold;}
input{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #333;
background:#1a1a1a;
color:white;
}
.option{
display:block;
padding:14px;
background:#181818;
border:1px solid #333;
border-radius:12px;
margin:10px 0;
cursor:pointer;
}
.option:hover{border-color:#D4AF37;}
button{
width:100%;
margin-top:25px;
padding:15px;
background:#D4AF37;
color:black;
font-weight:bold;
border:none;
border-radius:12px;
cursor:pointer;
}
.back{
display:inline-block;
margin-bottom:20px;
color:#D4AF37;
text-decoration:none;
}
</style>
</head>
<body>

<div class="box">

<a href="index.html" class="back">← Назад</a>

<h1>Офицерская комиссия</h1>
<p class="sub">Шаг 1 из 5</p>

<label>Игровой ник</label>
<input type="text" placeholder="Введите ник">

<label>Сколько времени ты обычно онлайн?</label>

<label class="option"><input type="radio" name="online"> До 1 часа</label>
<label class="option"><input type="radio" name="online"> 1–3 часа</label>
<label class="option"><input type="radio" name="online"> 3–5 часов</label>
<label class="option"><input type="radio" name="online"> Более 5 часов</label>

<button>Продолжить</button>

</div>

</body>
</html>
